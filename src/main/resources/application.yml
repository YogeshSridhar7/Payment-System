server:
  port : 8081
spring:
  logging:
    level:
      liquibase: debug
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres
    username: postgres
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.yaml

